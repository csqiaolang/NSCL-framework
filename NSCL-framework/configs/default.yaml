# Training Parameters
learning_rate: 0.0001
weight_decay: 0.00001
batch_size: 64
max_epochs: 100
early_stopping_patience: 10

# Model Architecture
gnn_layers: 3
hidden_dim: 256
concept_dim: 128
num_heads: 8

# Thresholds (from Methods section)
tau_obj: 0.7
tau_attr: 0.8
tau_hom: 0.01
theta_consistency: 0.85